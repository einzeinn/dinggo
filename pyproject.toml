[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dinggo"
version = "0.3.0"
description = "Specification-Driven AI Product Factory with multi-worker DAG execution, automated self-repair, and independent review audits"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "rich>=13.0.0",
    "prompt_toolkit>=3.0.0",
    "httpx>=0.24.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "contextix>=0.6.0"
]

[project.scripts]
dinggo = "cli.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
where = ["."]
include = ["cli*", "core*", "tools*"]

